version: 2
updates:
  # Go modules: golang.org/x/term and golang.org/x/sys.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  # The actions in .github/workflows are pinned to a commit; this keeps the pin and
  # the version comment next to it current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
